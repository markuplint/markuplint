name: Rust

on:
    pull_request:
        branches:
            - dev
            - v6
        paths:
            - '.github/workflows/rust.yml'
            - 'crates/**'
    push:
        branches:
            - dev
            - v6
        paths:
            - '.github/workflows/rust.yml'
            - 'crates/**'

jobs:
    fmt-clippy-test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Check formatting
              working-directory: crates
              run: cargo fmt --check

            - name: Clippy
              working-directory: crates
              run: cargo clippy -- -D warnings

            - name: Test
              working-directory: crates
              run: cargo test

    napi-smoke:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Use Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: 22

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/target
                  key: ${{ runner.os }}-cargo-napi-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-napi-

            - name: Install napi-rs CLI
              run: npm install -g @napi-rs/cli

            - name: Build napi
              working-directory: packages/@markuplint/core
              run: napi build --manifest-path ../../../crates/markuplint-napi/Cargo.toml --output-dir . --platform

            - name: Smoke test
              working-directory: packages/@markuplint/core
              run: node -e "const {NapiDom} = require('./index.js'); const dom = new NapiDom('{\"nodeList\":[],\"raw\":\"\",\"isFragment\":false}'); console.log('napi works, nodes:', dom.nodeCount)"
