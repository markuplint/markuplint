name: Rust

on:
    pull_request:
        branches:
            - dev
            - v6
        paths:
            - '.github/workflows/rust.yml'
            - 'crates/**'
    push:
        branches:
            - dev
            - v6
        paths:
            - '.github/workflows/rust.yml'
            - 'crates/**'

jobs:
    fmt-clippy-test:
        # Ubuntu only: Rust layer is pure computation (string processing, data
        # transformation) with no platform-dependent I/O, path handling, or
        # system calls. Cross-platform concerns (file paths, line endings,
        # Unicode normalization) are handled by the Node.js/TS layer.
        # napi-smoke still runs on all 3 platforms to cover the FFI boundary.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  submodules: recursive

            - name: Install Rust
              # dtolnay/rust-toolchain has no tags; `@stable` is a mutable
              # branch ref, not an immutable release. Pin a commit from the
              # master branch's history instead (master's action.yml requires
              # `toolchain` as an explicit input with no default — omitting it
              # fails the step).
              uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Check formatting
              working-directory: crates
              run: cargo fmt --check

            - name: Clippy
              working-directory: crates
              run: cargo clippy -- -D warnings

            - name: Test
              working-directory: crates
              run: cargo test

    napi-smoke:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Install Rust
              # See the fmt-clippy-test job above for why this is pinned by
              # commit SHA with an explicit `toolchain` input.
              uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
              with:
                  toolchain: stable

            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 22

            - name: Cache cargo
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/target
                  key: ${{ runner.os }}-cargo-napi-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-napi-

            - name: Install napi-rs CLI
              run: npm install -g @napi-rs/cli

            - name: Build napi
              working-directory: packages/@markuplint/core
              run: napi build --manifest-path ../../../crates/markuplint-builder/Cargo.toml --output-dir . --platform --js index.cjs

            - name: Smoke test (DOM)
              working-directory: packages/@markuplint/core
              run: node -e "const {NapiDom} = require('./index.cjs'); const json = JSON.stringify({nodeList:[], raw:'', isFragment:false}); const dom = new NapiDom(json); console.log('napi DOM works, nodes:', dom.nodeCount)"

            - name: Smoke test (CSS value matching)
              working-directory: packages/@markuplint/core
              run: node -e "const m = require('./index.cjs'); const r1 = m.matchCssSyntax('auto | none', 'auto'); if (!r1.matched) throw new Error('auto should match'); const r2 = m.matchCssSyntax('auto | none', 'invalid'); if (r2.matched) throw new Error('invalid should not match'); const r3 = m.matchCssProperty('<length> | auto', 'inherit'); if (!r3.matched) throw new Error('inherit should match as CSS-wide keyword'); const r4 = m.matchCssSyntax('<length>', 'calc(100% - 20px)'); if (!r4.matched) throw new Error('calc should match'); const r5 = m.matchCssSyntax('<length>', 'var(--x)'); if (!r5.matched) throw new Error('var should match'); console.log('napi CSS matching works')"

            # Rust lint pipeline smoke test requires TS build (html-parser, html-spec).
            # Run locally: node packages/@markuplint/core/smoke-lint.mjs
            # CI coverage: napi-smoke builds .node binary; TS CI (test job) runs
            # e2e.spec.ts which imports lint() and verifies end-to-end.
