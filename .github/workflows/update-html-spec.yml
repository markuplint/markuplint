name: Update HTML Spec

on:
    schedule:
        - cron: '0 0 * * *' # Daily at 09:00 JST
        - cron: '0 12 * * *' # Daily at 21:00 JST
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

env:
    BRANCH_NAME: auto/update-html-spec
    NODE_BUILD_VERSION: 26
    NX_DISABLE_DB: true

jobs:
    update-html-spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: dev

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-ubuntu-latest-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Run up:gen
              run: yarn up:gen

            - name: Check for changes
              id: changes
              run: |
                  if git diff --quiet; then
                    echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check for existing open PR
              if: steps.changes.outputs.has_changes == 'true'
              id: existing-pr
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
                  if [ -n "$PR_NUMBER" ]; then
                    echo "pr_exists=true" >> "$GITHUB_OUTPUT"
                    echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
                  else
                    echo "pr_exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit and push changes
              if: steps.changes.outputs.has_changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B "$BRANCH_NAME"
                  git add -A
                  git commit -m "chore: update html-spec generated data"
                  git push --force origin "$BRANCH_NAME"

            # Composed after the commit so the (gitignored) summary file is not
            # committed and pr-body.md is never staged by `git add -A`.
            - name: Compose PR body
              if: steps.changes.outputs.has_changes == 'true'
              run: |
                  SUMMARY_FILE="packages/@markuplint/html-spec/generator-summary.md"
                  {
                    echo "Automated update of \`@markuplint/html-spec\` generated data."
                    echo ""
                    echo "This PR was created automatically by the **Update HTML Spec** workflow."
                    echo "It runs \`yarn up:gen\` to regenerate the HTML spec data from the latest HTML Living Standard."
                    echo ""
                    echo "## Changes"
                    echo ""
                    if [ -f "$SUMMARY_FILE" ]; then
                      cat "$SUMMARY_FILE"
                    else
                      echo "_No summary was generated._"
                    fi
                    echo ""
                    echo "If this PR is outdated, it will be updated automatically on the next scheduled run."
                  } > pr-body.md

            - name: Create PR
              if: steps.changes.outputs.has_changes == 'true' && steps.existing-pr.outputs.pr_exists == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr create \
                    --base dev \
                    --head "$BRANCH_NAME" \
                    --title "chore: update html-spec generated data" \
                    --body-file pr-body.md \
                    --label "Specs"

            - name: Update existing PR body
              if: steps.changes.outputs.has_changes == 'true' && steps.existing-pr.outputs.pr_exists == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh pr edit "${{ steps.existing-pr.outputs.pr_number }}" --body-file pr-body.md
