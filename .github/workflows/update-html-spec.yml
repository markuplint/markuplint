name: Update HTML Spec

on:
    schedule:
        - cron: '0 0 * * *' # Daily at 09:00 JST
        - cron: '0 12 * * *' # Daily at 21:00 JST
    workflow_dispatch:

# The push and the PR go through a GitHub App token, not GITHUB_TOKEN: a `pull_request` run
# caused by GITHUB_TOKEN stops at `action_required` until someone approves it by hand, and
# GITHUB_TOKEN cannot approve it. An App token triggers test.yml like a person's push does.
permissions:
    contents: read

env:
    BRANCH_NAME: auto/update-html-spec
    NODE_BUILD_VERSION: 26
    NX_DISABLE_DB: true

jobs:
    update-html-spec:
        runs-on: ubuntu-latest
        steps:
            # The App needs Contents and Pull requests (read and write) on this repository.
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.BOT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: dev
                  # `git push` below authenticates with the credentials checkout persists.
                  token: ${{ steps.app-token.outputs.token }}

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      **/node_modules
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-modules-ubuntu-latest-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install dependencies
              run: yarn install --immutable

            # A failed fetch exits non-zero after writing the output, so the PR
            # steps still run; the last step fails the job afterwards.
            - name: Run up:gen
              id: gen
              continue-on-error: true
              run: yarn up:gen

            - name: Check for changes
              id: changes
              run: |
                  if git diff --quiet; then
                    echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check for existing open PR
              if: steps.changes.outputs.has_changes == 'true'
              id: existing-pr
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
                  if [ -n "$PR_NUMBER" ]; then
                    echo "pr_exists=true" >> "$GITHUB_OUTPUT"
                    echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
                  else
                    echo "pr_exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit and push changes
              if: steps.changes.outputs.has_changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B "$BRANCH_NAME"
                  git add -A
                  git commit -m "chore: update html-spec generated data"
                  git push --force origin "$BRANCH_NAME"

            # Composed after the commit so the (gitignored) summary file is not
            # committed and pr-body.md is never staged by `git add -A`.
            - name: Compose PR body
              if: steps.changes.outputs.has_changes == 'true'
              run: |
                  SUMMARY_FILE="packages/@markuplint/html-spec/generator-summary.md"
                  {
                    echo "Automated update of \`@markuplint/html-spec\` generated data."
                    echo ""
                    echo "This PR was created automatically by the **Update HTML Spec** workflow."
                    echo "It runs \`yarn up:gen\` to regenerate the HTML spec data from the latest HTML Living Standard."
                    echo ""
                    echo "## Changes"
                    echo ""
                    if [ -f "$SUMMARY_FILE" ]; then
                      cat "$SUMMARY_FILE"
                    else
                      echo "_No summary was generated._"
                    fi
                    echo ""
                    echo "If this PR is outdated, it will be updated automatically on the next scheduled run."
                  } > pr-body.md

            - name: Create PR
              if: steps.changes.outputs.has_changes == 'true' && steps.existing-pr.outputs.pr_exists == 'false'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  gh pr create \
                    --base dev \
                    --head "$BRANCH_NAME" \
                    --title "chore: update html-spec generated data" \
                    --body-file pr-body.md \
                    --label "Specs"

            - name: Update existing PR body
              if: steps.changes.outputs.has_changes == 'true' && steps.existing-pr.outputs.pr_exists == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: gh pr edit "${{ steps.existing-pr.outputs.pr_number }}" --body-file pr-body.md

            - name: Fail when up:gen failed
              if: steps.gen.outcome == 'failure'
              run: |
                  echo "::error::yarn up:gen failed: a fetch failed, a page expected not to exist answered, or generation crashed. See the Run up:gen step."
                  exit 1
