name: Website Test

on:
    pull_request:
        branches:
            - dev
        paths:
            - 'website/**'
            - '.github/workflows/website.yml'
            # The website inherits the root .yarnrc.yml, and install-scripts.spec.ts
            # checks the website tree only here (see the install-scripts job).
            - '.yarnrc.yml'
            - 'packages/@markuplint/test-tools/src/install-scripts.spec.ts'

env:
    NODE_BUILD_VERSION: 26

jobs:
    dev-setup:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Cache Restore website dependencies
              id: cache-restore-website
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: 'website/node_modules'
                  key: website-depends-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('website/yarn.lock') }}

            - name: Install website dependencies
              if: steps.cache-restore-website.outputs.cache-hit != 'true'
              run: cd website && yarn install --immutable

            - name: Cache Save website dependencies
              if: steps.cache-restore-website.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: 'website/node_modules'
                  key: website-depends-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('website/yarn.lock') }}

    build:
        needs: dev-setup
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Cache Restore website dependencies
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: 'website/node_modules'
                  key: website-depends-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('website/yarn.lock') }}

            - name: Install website dependencies
              run: cd website && yarn install --immutable

            - name: Build
              run: cd website && yarn site:build

    # The root test jobs never install website/node_modules, so the website
    # cases of install-scripts.spec.ts can only run where the website tree
    # exists: here.
    install-scripts:
        needs: dev-setup
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-ubuntu-latest-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Cache Restore website dependencies
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: 'website/node_modules'
                  key: website-depends-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('website/yarn.lock') }}

            - name: Install website dependencies
              run: cd website && yarn install --immutable

            - name: Check dependenciesMeta against the installed trees
              run: yarn vitest run packages/@markuplint/test-tools/src/install-scripts.spec.ts
