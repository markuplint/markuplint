name: Cargo Deny

permissions:
    contents: read

# A pull request gets this workflow through `test.yml`; see the trigger comment of `rust.yml`.
on:
    workflow_call:
    push:
        branches:
            - dev
            - v6
        paths:
            - '.github/workflows/cargo-deny.yml'
            - 'crates/**'
            - 'deny.toml'
    # NOTE: GitHub only runs scheduled workflows from a repository's
    # default branch, so this trigger stays inert on v6 until it merges
    # into dev.
    schedule:
        - cron: '17 4 * * 1'

jobs:
    cargo-deny:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                checks:
                    - advisories
                    - bans licenses sources
        # advisories is time-dependent — a new RustSec entry can land
        # without any code change here — so it reports without blocking
        # the job. bans/licenses/sources are deterministic given the
        # lockfile and do block.
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
              with:
                  manifest-path: crates/Cargo.toml
                  command: check ${{ matrix.checks }}
