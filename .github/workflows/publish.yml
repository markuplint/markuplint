name: Publish

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: yarn build

            - name: Determine dist-tag
              id: dist-tag
              run: |
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  if [[ "$VERSION" == *"-alpha"* ]]; then
                    echo "tag=alpha" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-beta"* ]]; then
                    echo "tag=beta" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-rc"* ]]; then
                    echo "tag=rc" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-"* ]]; then
                    echo "::error::Unknown prerelease tag in version: $VERSION"
                    exit 1
                  else
                    # A stable release from a maintenance line (its major is
                    # below the major currently on `latest`) must not take
                    # `latest` away from the current line: publish it under
                    # the `v<major>` dist-tag instead.
                    MAJOR="${VERSION%%.*}"
                    LATEST_MAJOR="$(npm view markuplint@latest version | cut -d. -f1)"
                    if [[ "$MAJOR" -lt "$LATEST_MAJOR" ]]; then
                      echo "tag=v${MAJOR}" >> "$GITHUB_OUTPUT"
                    else
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                    fi
                  fi

            - name: Publish
              run: npx lerna publish from-git --dist-tag ${{ steps.dist-tag.outputs.tag }} --yes
