name: Publish

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        # A run started by hand publishes whatever the branch's package.json
        # versions say that the registry lacks: only `main` (stable) is allowed.
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: yarn build

            - name: Determine dist-tag
              id: dist-tag
              run: |
                  VERSION="$(node -p "require('./lerna.json').version")"
                  if [[ "$VERSION" == *"-alpha"* ]]; then
                    echo "tag=alpha" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-beta"* ]]; then
                    echo "tag=beta" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-rc"* ]]; then
                    echo "tag=rc" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-"* ]]; then
                    echo "::error::Unknown prerelease tag in version: $VERSION"
                    exit 1
                  else
                    # A stable release from a maintenance line (its major is
                    # below the major currently on `latest`) must not take
                    # `latest` away from the current line: publish it under
                    # the `v<major>` dist-tag instead.
                    MAJOR="${VERSION%%.*}"
                    LATEST_MAJOR="$(npm view markuplint@latest version | cut -d. -f1)"
                    if [[ "$MAJOR" -lt "$LATEST_MAJOR" ]]; then
                      echo "tag=v${MAJOR}" >> "$GITHUB_OUTPUT"
                    else
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                    fi
                  fi

            - name: Publish
              # `from-package` publishes only the packages whose version is not yet on
              # the registry, so running this job again after a partial publish
              # continues where it stopped. Publishing a package that is already on
              # the registry signs it a second time and fails with
              # TLOG_CREATE_ENTRY_ERROR 409 ("an equivalent entry already exists in
              # the transparency log").
              #
              # --concurrency 1 publishes one package at a time. The 409 can still
              # occur on a package's first attempt; run the job again.
              run: npx lerna publish from-package --dist-tag ${{ steps.dist-tag.outputs.tag }} --yes --concurrency 1
