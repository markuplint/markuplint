name: Publish

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 26
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: yarn build

            - name: Determine dist-tag
              id: dist-tag
              run: |
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  if [[ "$VERSION" == *"-alpha"* ]]; then
                    echo "tag=alpha" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-beta"* ]]; then
                    echo "tag=beta" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-rc"* ]]; then
                    echo "tag=rc" >> "$GITHUB_OUTPUT"
                  elif [[ "$VERSION" == *"-"* ]]; then
                    echo "::error::Unknown prerelease tag in version: $VERSION"
                    exit 1
                  else
                    # A stable release from a maintenance line (its major is
                    # below the major currently on `latest`) must not take
                    # `latest` away from the current line: publish it under
                    # the `v<major>` dist-tag instead.
                    MAJOR="${VERSION%%.*}"
                    LATEST_MAJOR="$(npm view markuplint@latest version | cut -d. -f1)"
                    if [[ "$MAJOR" -lt "$LATEST_MAJOR" ]]; then
                      echo "tag=v${MAJOR}" >> "$GITHUB_OUTPUT"
                    else
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                    fi
                  fi

            - name: Publish
              # --concurrency 1: the v4.18.4 publish (run 39725467477) failed three
              # times with TLOG_CREATE_ENTRY_ERROR 409 ("an equivalent entry already
              # exists in the transparency log") on packages published in the same
              # batch, and succeeded only after re-runs that skipped the already
              # published ones. Publishing one package at a time is the suspected
              # fix; it has not been confirmed on a release yet, and costs a few
              # minutes for the ~35 packages.
              run: npx lerna publish from-git --dist-tag ${{ steps.dist-tag.outputs.tag }} --yes --concurrency 1
