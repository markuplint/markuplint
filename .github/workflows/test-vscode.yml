name: VS Code Extension Running Test

on:
    pull_request:
        branches:
            - dev
        paths:
            - '.github/workflows/test-vscode.yml'
            - 'vscode/**'
            # The extension runs the language server of the checkout (a workspace
            # dependency) and, through it, markuplint and the other packages, so a
            # change to any of them alone can break it.
            - 'packages/**'

jobs:
    test:
        # Run the VS Code extension integration tests on both Linux and Windows.
        # Windows coverage exists specifically because of bugs like #3795 — the
        # `ERR_UNSUPPORTED_ESM_URL_SCHEME` crash that only manifested on Windows
        # drive-letter paths and went undetected under ubuntu-only CI.
        # The `engines.vscode` minimum runs too, on Linux only: a major of
        # `vscode-languageclient` can drop a VS Code that `engines.vscode` still
        # promises, and only the extension host of that version shows it. The
        # server also runs on that VS Code's own Node.js (TransportKind.ipc forks
        # it with Electron), so `engines.vscode` must name a VS Code whose Node.js
        # meets `engines.node` of the server and markuplint (>=24 from VS Code 1.123).
        # `minimum` is read from `engines.vscode` in `vscode/package.json`.
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                vscode-version:
                    - stable
                include:
                    - os: ubuntu-latest
                      vscode-version: minimum
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Install Xvfb (Linux only)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y xvfb

            - name: Start Xvfb (Linux only)
              if: runner.os == 'Linux'
              run: |
                  Xvfb :99 &
                  echo "DISPLAY=:99.0" >> "$GITHUB_ENV"

            - name: Install Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26

            - name: Enable Corepack and setup Yarn v4
              shell: bash
              run: |
                  corepack enable
                  yarn --version

            - name: Install dependencies
              shell: bash
              run: yarn install --immutable && yarn run build

            - name: Pin the VS Code version (minimum only)
              if: matrix.vscode-version == 'minimum'
              shell: bash
              run: echo "VSCODE_TEST_VERSION=$(node -p "require('./vscode/package.json').engines.vscode.match(/\d+\.\d+\.\d+/)[0]")" >> "$GITHUB_ENV"

            - name: Run tests
              shell: bash
              run: cd vscode && yarn install && npm run vscode:build && npm run vscode:test
