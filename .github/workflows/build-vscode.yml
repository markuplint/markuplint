name: VS Code Extension Packaging Test

on:
    pull_request:
        branches:
            - dev
            - v3
        paths:
            - 'vscode/**'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Install Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: 22

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Install root dependencies
              run: yarn install

            - name: Install dependencies and package
              run: yarn run vscode:package

            - name: Package prerelease build
              run: yarn run vscode:pre-package
