name: Test

on:
    pull_request:
        branches:
            - dev
            - v3
            - v6
            - next
        paths:
            - '.github/workflows/test.yml'
            - 'vitest.config.ts'
            - 'vitest.cross-os.config.ts'
            - 'packages/**'
            - '!**/*.md'
            - 'packages/@markuplint/config-presets/src/README.md'
            - 'test/**'
            - 'yarn.lock'
            - '.yarnrc.yml'
            - '.oxfmtrc.json'
            - '.oxlintrc.json'
            - 'cspell.json'
            - 'vscode/**'

env:
    NODE_BUILD_VERSION: 24
    NX_DISABLE_DB: true

jobs:
    dev-setup:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                node: [22, 24]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              id: cache-restore-dev-depends
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install dependencies
              if: steps.cache-restore-dev-depends.outputs.cache-hit != 'true'
              run: yarn install --immutable

            - name: Cache Save devDependencies
              if: steps.cache-restore-dev-depends.outputs.cache-hit != 'true'
              id: cache-save-dev-depends
              uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

    build:
        needs: dev-setup
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              id: cache-restore-dev-depends
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Cache Restore Production
              id: cache-restore-prod
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Setup Rust toolchain
              if: steps.cache-restore-prod.outputs.cache-hit != 'true'
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Restore Cargo
              if: steps.cache-restore-prod.outputs.cache-hit != 'true'
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      crates/target
                  key: ${{ runner.os }}-cargo-napi-${{ hashFiles('crates/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-napi-

            - name: Build napi (generates index.cjs and index.d.ts)
              if: steps.cache-restore-prod.outputs.cache-hit != 'true'
              working-directory: packages/@markuplint/core
              run: |
                  npm install -g @napi-rs/cli
                  napi build --manifest-path ../../../crates/markuplint-builder/Cargo.toml --output-dir . --platform --js index.cjs

            - name: Build
              if: steps.cache-restore-prod.outputs.cache-hit != 'true'
              run: yarn run build

            - name: Cache Save Production
              if: steps.cache-restore-prod.outputs.cache-hit != 'true'
              uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  enableCrossOsArchive: true
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-ubuntu-latest-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint (oxlint)
              run: yarn lint-check:oxlint

            - name: Format (oxfmt)
              run: yarn lint-check:format

            - name: Spellcheck
              run: yarn lint:spellcheck

    cross-os-setup:
        runs-on: ${{ matrix.os }}

        # For PRs from Renovate, update production dependencies only and then run tests.
        # For PRs not from Renovate, proceed with the usual setup and tests.
        if: |
            !contains(github.event.pull_request.labels.*.name, 'Renovate')
            ||
            contains(github.event.pull_request.labels.*.name, 'Dependencies: Production')

        strategy:
            fail-fast: false
            matrix:
                os:
                    - macos-latest
                    - windows-latest
                node: [24]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              id: cache-restore-dev-depends
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install dependencies
              if: steps.cache-restore-dev-depends.outputs.cache-hit != 'true'
              run: yarn install --immutable

            - name: Cache Save devDependencies
              if: steps.cache-restore-dev-depends.outputs.cache-hit != 'true'
              uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

    test:
        needs: [dev-setup, build]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-ubuntu-latest-node${{ matrix.node }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Cache Restore Production
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  enableCrossOsArchive: true
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Test
              uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
              with:
                  timeout_minutes: 20
                  max_attempts: 3
                  shell: bash
                  command: npx vitest run

    test-cross-os:
        # Implicitly skipped when cross-os-setup is skipped (Renovate devDeps PRs).
        needs: [cross-os-setup, build]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - macos-latest
                    - windows-latest
                node: [24]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Cache Restore Production
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  enableCrossOsArchive: true
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Test (cross-OS path-sensitive packages)
              uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
              with:
                  timeout_minutes: 10
                  max_attempts: 2
                  shell: bash
                  command: npx vitest run --config vitest.cross-os.config.ts

    isolated-env:
        needs: [dev-setup, build]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                pm: [npm, yarn, pnpm]
                env: [esm, ts, ts-config-ts]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  # SEE: https://github.com/lerna/lerna/issues/2542
                  fetch-depth: '0'

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            # Add step to remove packageManager field using jq for pnpm tests
            - name: Remove packageManager field from package.json
              if: matrix.pm == 'pnpm'
              run: |
                  echo 'Removing packageManager field...'
                  jq 'del(.packageManager)' package.json > package.json.tmp && mv package.json.tmp package.json
                  echo 'package.json content after removal:'
                  cat package.json
              shell: bash

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-${{ matrix.os }}-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Cache Restore Production
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  enableCrossOsArchive: true
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Create sandbox directory
              run: |
                  mkdir -p ${{ github.workspace }}/../sandbox
                  cp -r ${{ github.workspace }}/test ${{ github.workspace }}/../sandbox
                  find ${{ github.workspace }}/../sandbox/test -maxdepth 1 2>/dev/null || true

            - name: Delete package manager settings
              run: jq 'del(.packageManager)' package.json > tmp.json && mv tmp.json package.json

            - name: Install pnpm
              if: matrix.pm == 'pnpm'
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
              with:
                  version: latest # Use latest pnpm version
                  run_install: false

            - name: Setup Yarn v4 for sandbox
              if: matrix.pm == 'yarn'
              working-directory: ../sandbox/test/isolated-env/${{ matrix.env }}
              run: |
                  cp ${{ github.workspace }}/.yarnrc.yml .yarnrc.yml
                  echo 'enableHardenedMode: false' >> .yarnrc.yml
                  # Build resolutions from dependencies to force yarn to use file: versions
                  # for transitive dependencies (prevents npm registry fallback)
                  jq '. + {"packageManager": "yarn@4.12.0"} + {"resolutions": .dependencies}' package.json > tmp.json && mv tmp.json package.json

            - name: Install dependencies
              working-directory: ../sandbox/test/isolated-env/${{ matrix.env }}
              env:
                  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
              run: ${{ matrix.pm }} install

            - name: Test
              working-directory: ../sandbox/test/isolated-env/${{ matrix.env }}
              env:
                  DEBUG: ${{ matrix.env == 'ts-config-ts' && 'ml-*' || '' }}
              run: ${{ matrix.pm }} test

    test-bun:
        needs: build
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: '0'

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-ubuntu-latest-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Cache Restore Production
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  enableCrossOsArchive: true
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Test with Bun
              run: bunx --bun vitest run

    test-deno:
        needs: build
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: '0'

            - name: Use Node.js ${{ env.NODE_BUILD_VERSION }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
              with:
                  node-version: ${{ env.NODE_BUILD_VERSION }}

            - name: Enable Corepack and setup Yarn v4
              run: |
                  corepack enable
                  yarn --version

            - name: Setup Deno
              uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
              with:
                  deno-version: latest

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

            - name: Cache Restore devDependencies
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  path: |
                      '**/node_modules'
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: dev-depends-ubuntu-latest-node${{ env.NODE_BUILD_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Cache Restore Production
              uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
              with:
                  enableCrossOsArchive: true
                  path: |
                      packages/**/lib
                      packages/**/cjs
                      packages/**/esm
                      packages/@markuplint/config-presets/preset.*.json
                      packages/@markuplint/html-spec/index.js
                      packages/@markuplint/html-spec/index.json
                      packages/@markuplint/core/index.cjs
                      packages/@markuplint/core/index.d.ts
                      packages/@markuplint/core/*.node
                  key: prod-node${{ env.NODE_BUILD_VERSION }}-${{ github.sha }}

            - name: Install dependencies
              run: yarn install --immutable

            - name: Test with Deno
              run: deno run -A --unstable-detect-cjs node_modules/vitest/vitest.mjs run
