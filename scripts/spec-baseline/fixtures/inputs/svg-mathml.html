<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>SVG and MathML</title>
	</head>
	<body>
		<h1>Foreign content</h1>

		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="t">
			<title id="t">An image</title>
			<desc>A description</desc>
			<defs>
				<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
					<stop offset="0" stop-color="red" />
					<stop offset="1" stop-color="blue" />
				</linearGradient>
				<filter id="f">
					<feGaussianBlur stdDeviation="2" />
					<feOffset dx="1" dy="1" />
				</filter>
				<clipPath id="c"><rect width="10" height="10" /></clipPath>
				<mask id="m"><circle r="5" /></mask>
				<pattern id="p" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" /></pattern>
				<marker id="mk" markerWidth="2" markerHeight="2"><path d="M0 0L1 1" /></marker>
				<symbol id="s" viewBox="0 0 1 1"><rect width="1" height="1" /></symbol>
			</defs>
			<g fill="url(#g)" filter="url(#f)">
				<rect x="0" y="0" width="50" height="50" rx="2" ry="2" />
				<circle cx="75" cy="25" r="20" />
				<ellipse cx="25" cy="75" rx="20" ry="10" />
				<line x1="0" y1="0" x2="100" y2="100" stroke="black" />
				<polyline points="0,0 10,10 20,0" fill="none" />
				<polygon points="50,50 60,60 40,60" />
				<path d="M10 10 L 20 20" stroke-width="2" stroke-linecap="round" />
			</g>
			<use href="#s" x="10" y="10" width="10" height="10" />
			<use xlink:href="#s" />
			<text x="10" y="90" font-size="10" text-anchor="middle">
				Text <tspan font-weight="bold">bold</tspan>
				<textPath href="#p">on a path</textPath>
			</text>
			<image href="a.png" width="10" height="10" decoding="async" fetchpriority="high" />
			<a href="https://example.com/"><text x="0" y="0">link</text></a>
			<script>
				var x = 1;
			</script>
			<script href="a.js" async></script>
			<script><circle r="1" /></script>
			<style>
				rect {
					fill: red;
				}
			</style>
			<switch><g systemLanguage="en"></g></switch>
			<foreignObject x="0" y="0" width="50" height="50">
				<div>HTML in a foreign object</div>
				<p>A paragraph</p>
			</foreignObject>
			<animate attributeName="x" from="0" to="10" dur="1s" repeatCount="indefinite" />
			<set attributeName="y" to="1" />
			<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" />
			<div>an HTML element in an svg element</div>
			<rect />
			<circle r="-1" />
			<rect width="x" height="1" foo="bar" />
			<unknown-svg-element />
			<fooBar />
			<mfrac></mfrac>
		</svg>

		<svg viewBox="0 0 1 1"></svg>
		<svg>
			<g><title>a title in a group</title></g>
			<g><desc>a description in a group</desc><title>title after desc</title></g>
		</svg>
		<p>Text with an <svg width="10" height="10"><circle r="5" /></svg> inline svg.</p>
		<button type="button"><svg aria-hidden="true" width="10" height="10"><path d="M0 0" /></svg> Button</button>
		<button type="button"><svg role="img"><title>Named</title></svg></button>

		<math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
			<mrow>
				<mi>x</mi>
				<mo>=</mo>
				<mfrac>
					<mrow>
						<mo>&#x2212;</mo>
						<mi>b</mi>
						<mo>&#xB1;</mo>
						<msqrt>
							<msup><mi>b</mi><mn>2</mn></msup>
							<mo>&#x2212;</mo>
							<mn>4</mn>
							<mi>a</mi>
							<mi>c</mi>
						</msqrt>
					</mrow>
					<mrow>
						<mn>2</mn>
						<mi>a</mi>
					</mrow>
				</mfrac>
			</mrow>
			<mtable columnalign="left" rowalign="top" frame="solid" rowlines="solid" columnlines="solid" displaystyle="true" equalrows="true" equalcolumns="true" align="axis" side="left" width="auto" columnwidth="auto" columnspacing="1em" rowspacing="1em" framespacing="1em" minlabelspacing="1em">
				<mtr rowalign="top" columnalign="left">
					<mtd rowspan="2" columnspan="2" rowalign="top" columnalign="left"><mi>a</mi></mtd>
					<mtd><mn>1</mn></mtd>
				</mtr>
			</mtable>
			<menclose notation="box"><mi>y</mi></menclose>
			<mfenced open="[" close="]" separators=","><mi>a</mi><mi>b</mi></mfenced>
			<msub><mi>x</mi><mn>1</mn></msub>
			<munderover><mo>&#x2211;</mo><mi>i</mi><mi>n</mi></munderover>
			<mstyle mathvariant="bold" mathsize="2" mathcolor="red" mathbackground="yellow"><mi>s</mi></mstyle>
			<mtext>text</mtext>
			<mspace width="1em" />
			<semantics><mi>x</mi><annotation encoding="application/x-tex">x</annotation></semantics>
			<mi foo="bar">unknown attribute</mi>
			<unknown-math />
			<div>HTML in math</div>
			<rect />
		</math>
		<p>Inline <math><mi>x</mi></math> math.</p>
	</body>
</html>
