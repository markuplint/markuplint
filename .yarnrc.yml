enableGlobalCache: true

# Yarn 4.14.0 made this default to false and made approvedGitRepositories
# default to []. When Yarn migrates a lockfile older than v9 it writes the
# pre-4.14 values (`enableScripts: true`, `approvedGitRepositories: ["**"]`)
# into this file for any key that is not set yet, to keep the old behavior;
# that is how commit 0aac205a1 ("pin yarn to 4.14.1 ... regenerate lockfile")
# picked them up. A key that is set explicitly is left alone, so this line
# stays; approvedGitRepositories is left unset on purpose, and
# `packages/@markuplint/test-tools/src/install-scripts.spec.ts` fails if a
# migration or an edit ever widens it again. Packages that need their build
# scripts are listed one by one under `dependenciesMeta` in package.json
# (`built: true` to run the script, `built: false` to skip it on purpose);
# this file is also read by the separate Yarn project in `website/`, which
# keeps its own list.
enableScripts: false

nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org"
npmMinimalAgeGate: 7d

# npmMinimalAgeGate guards against installing a recently-compromised
# third-party package, but it also blocks this repo's own packages
# right after every release: the isolated-env sandbox test installs a
# packed `markuplint` tarball, whose own dependencies (@markuplint/*)
# resolve from the real registry at whatever version was just published
# by publish.yml moments earlier — nothing to gate here, since we
# published it ourselves.
npmPreapprovedPackages:
  - "markuplint"
  - "@markuplint/*"
  - "@markuplint-dev/*"
