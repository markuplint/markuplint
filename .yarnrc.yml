enableGlobalCache: true

# Yarn 4.14.0 made this default to false; it was flipped back to true in
# commit 0aac205a1 ("pin yarn to 4.14.1") along with approvedGitRepositories,
# in a commit whose message only talks about lockfile format — undoing both
# of Yarn's new hardened defaults with no stated reason. Restored here.
# Packages that legitimately need their build/install scripts are opted in
# individually via `dependenciesMeta` in package.json.
enableScripts: false

nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org"
npmMinimalAgeGate: 7d
