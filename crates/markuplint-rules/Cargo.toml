[package]
name = "markuplint-rules"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
markuplint-core = { path = "../markuplint-core" }
markuplint-dom = { path = "../markuplint-dom" }
markuplint-html-parser = { path = "../markuplint-html-parser" }
markuplint-selector = { path = "../markuplint-selector" }
markuplint-types = { path = "../markuplint-types" }
strsim = "0.11"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Pinned exactly: a low-download-count, single-maintainer crate on the
# natural-language date parsing path (rules/require_datetime.rs). A caret
# range would let a future 0.1.x land without review whenever the
# lockfile is regenerated.
whichtime = "=0.1.0"

[dev-dependencies]
# The tests compare each hand-written matcher with the regular expression it replaced; `equivalence` gives
# the strings, and no rule compiles a regular expression of its own.
regex = { workspace = true }
# `equivalence`, the strings of the tests that compare a matcher with the regular expression it replaced.
markuplint-types = { path = "../markuplint-types", features = ["test-support"] }
markuplint-dom = { path = "../markuplint-dom", features = ["html-parser"] }

[lints]
workspace = true
