[package]
name = "markuplint-types"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Exposes `equivalence`: the strings on which the tests of `markuplint-rules` and
# `markuplint-selector` compare a hand-written matcher with the regular expression it replaced.
# A dependent turns it on in its `dev-dependencies`.
test-support = []

[dependencies]
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
url = "2"

# Only the equivalence tests read the regular expressions that the hand-written matchers replaced.
[dev-dependencies]
regex = { workspace = true }

# The Rust half of `yarn spec-baseline perf --rust`. It is a program of its own (the TypeScript side starts it for each
# sample), and its pure parts have tests that `cargo test` runs.
[[example]]
name = "spec_baseline"
test = true

# The Rust half of the packed candidates of `scripts/spec-baseline/packed/`: it reads, checks, composes and encodes
# the spec in the layout that `format.ts` describes, byte for byte as the TypeScript side does, and measures them.
[[example]]
name = "packed_candidates"
path = "examples/packed_candidates/main.rs"
test = true

[lints]
workspace = true
